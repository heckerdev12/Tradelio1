[package]
name = "tradelio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tradelio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core Tauri
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Security - Password & Key Management
bcrypt = "0.15"
keyring = "2.3"

# Async runtime
tokio = { version = "1", features = ["sync"] }

# Database with bundled SQLite (no external dependencies!)
rusqlite = { version = "0.31", features = ["bundled"] }

# AES-GCM encryption for database fields
aes-gcm = "0.10"

# Base64 encoding for storing encrypted data
base64 = "0.21"

# Random number generation for encryption keys/nonces
rand = "0.8"

# Date/Time handling for timestamps
chrono = { version = "0.4", features = ["serde"] }

# Better error handling
anyhow = "1.0"
thiserror = "1.0"

# UUID generation for unique identifiers
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTTP requests for fetching RSS feeds
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

dirs = "5.0"
#data export
csv = "1.3"
tera = "1.19"
wkhtmltopdf = "0.4"  # Lighter than Chrome, still good quality
tauri-plugin-notification = "2.0.0"
tauri-plugin-shell = "2"
[features]
default = []
