[package]
name = "tradelio"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "tradelio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Build-time helpers for Tauri (generates bindings, bundling, etc.)
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# -----------------------
# Tauri core & plugins
# -----------------------
# Core runtime for building desktop apps with Tauri
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }

# Official/community plugins for common desktop features
tauri-plugin-opener = "2"        # open external links / files with system handlers
tauri-plugin-store = "2"         # simple key/value store plugin
tauri-plugin-dialog = "2"        # show native dialogs (alerts, confirmations, file pickers)
tauri-plugin-notification = "2.0.0" # native notifications
tauri-plugin-shell = "2"         # run shell commands (careful with security)

# -----------------------
# Serialization / Data formats
# -----------------------
serde = { version = "1", features = ["derive"] } # serde derive for (de)serializing structs
serde_json = "1"                                 # read/write JSON

# -----------------------
# Security: hashing, keyring, encryption
# -----------------------
bcrypt = "0.15"            # password hashing (bcrypt) - for storing/verifying credentials
keyring = "2.3"            # OS keyring access for securely storing secrets
aes-gcm = "0.10"           # AES-GCM authenticated encryption (use for encrypting DB fields)

# -----------------------
# Storage / Database
# -----------------------
# rusqlite with bundled SQLite (no external SQLite dependency required)
rusqlite = { version = "0.31", features = ["bundled"] }

# -----------------------
# Encoding / Randomness / IDs
# -----------------------
base64 = "0.21"            # base64 encode/decode (store encrypted blobs safely)
rand = "0.8"               # RNG for keys/nonces (use secure RNGs from this crate)
uuid = { version = "1.0", features = ["v4", "serde"] } # UUID generation (v4) + serde support

# -----------------------
# Async runtime & Networking
# -----------------------
tokio = { version = "1", features = ["sync"] }  # async runtime used by reqwest and other async code
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] } # HTTP client with rustls TLS

# -----------------------
# Date / Time
# -----------------------
chrono = { version = "0.4", features = ["serde"] } # datetime handling + serde support

# -----------------------
# Error handling
# -----------------------
anyhow = "1.0"   # ergonomic error handling for application-level errors
thiserror = "1.0" # derive-friendly error types

# -----------------------
# Export / Reporting / Templating
# -----------------------
csv = "1.3"      # CSV writer for Excel/CSV exports
tera = "1.19"    # templating for HTML reports
html_to_pdf_lib = "=0.1.2" # html to pdf converstion

# -----------------------
# Utilities / Platform helpers
# -----------------------
dirs = "5.0"     # locate platform-specific directories (config, data, cache)

[features]
default = []
