    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri + React</title>

  <body style="margin:0; background:#0e0f10;">
    <!-- Splash screen with image only -->
    <div id="startup" style="

      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0e0f10 0%, #1a1b1d 100%);
      user-select: none;
      pointer-events: none;
    ">
      <img src="src/assets/tradelio12.png" alt="Splash Image" style="

        object-fit: fill;
        border-radius: 12px;

      " />

    <!-- React root -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
